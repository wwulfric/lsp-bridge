name: test
on: [ push, pull_request, workflow_dispatch ]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        emacs_version:
          - "28.1"

    steps:
      - uses: actions/checkout@v2

      - name: Install emacs (Linux)
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
        if: matrix.os != 'windows-latest'

      - name: Install emacs (Windows)
        uses: jcs090218/setup-emacs-windows@master
        with:
          version: ${{ matrix.emacs_version }}
        if: matrix.os == 'windows-latest'

      - name: Install Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}
          architecture: "x64"

      - name: Install locked bridge dependencies and Python language servers
        run: |
          python -m pip install uv==0.6.12 basedpyright ruff
          uv sync --locked --python python

      - name: test
        run: |
          echo ${PATH}
          uv run --locked python -m test.test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-log-${{ matrix.python }}
          path: test.log
          retention-days: 3