name: external-source-providers
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      download_smoke:
        description: 'Also download/verify the official GHC 9.12.2 source archive'
        type: boolean
        default: false
jobs:
  providers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install epc sexpdata six watchdog packaging
      - run: python -m unittest test.test_source -v
      - uses: purcell/setup-emacs@master
        if: runner.os != 'Windows'
        with:
          version: '29.4'
      - uses: jcs090218/setup-emacs-windows@master
        if: runner.os == 'Windows'
        with:
          version: '29.4'
      - uses: actions/checkout@v4
        with:
          repository: jrblevin/markdown-mode
          ref: d51c469133d220823cc6ab50ff8e8743ed6e42fb
          path: .test-deps/markdown-mode
      - uses: actions/checkout@v4
        with:
          repository: joaotavora/yasnippet
          ref: dd570a6b22364212fff9769cbf4376bdbd7a63c5
          path: .test-deps/yasnippet
      - run: emacs -Q --batch -L .test-deps/markdown-mode -L .test-deps/yasnippet -L acm -L . -l test/source-tests.el -f ert-run-tests-batch-and-exit
      - run: emacs -Q --batch -L . -f batch-byte-compile lsp-bridge-source.el
      - name: Official archive installation smoke
        if: github.event_name == 'workflow_dispatch' && inputs.download_smoke
        run: python -m test.source_install_smoke
